[workspace]
members = ["."]
resolver = "3"

[package]
name = "neo-j2k-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.100"
license = "BSD-2-Clause"

[package.metadata]
cargo-fuzz = true

[features]
# the C++ oracle, and the Tier-1 entry points of the codec that the `t1` target compares with it
oracle = ["dep:neo-j2k-oracle", "neo-j2k/bench-internals"]

[dependencies]
libfuzzer-sys = "0.4"
neo-j2k = { path = "../neo-j2k" }
neo-j2k-oracle = { path = "../neo-j2k-oracle", optional = true }

[[bin]]
name = "header_decode"
path = "fuzz_targets/header_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
required-features = ["oracle"]
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encode_options"
path = "fuzz_targets/encode_options.rs"
required-features = ["oracle"]
test = false
doc = false
bench = false

[[bin]]
name = "api_sequence"
path = "fuzz_targets/api_sequence.rs"
required-features = ["oracle"]
test = false
doc = false
bench = false

[[bin]]
name = "t1"
path = "fuzz_targets/t1.rs"
required-features = ["oracle"]
test = false
doc = false
bench = false
