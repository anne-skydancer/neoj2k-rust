#
# cargo-deny (the rust-lint CI job): licences, advisories, sources and bans of the workspace's
# dependency graph. The crate has no runtime dependency; every dependency a later stage adds must
# pass this and get its row in NOTICE.md's licence audit.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# the licences the twin and its tests may take: neo-j2k's own, and permissive ones compatible
# with BSD-2-Clause and with Vulkanstorm's GPL-3.0-or-later
allow = ["BSD-2-Clause", "BSD-3-Clause", "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# C and C++ build helpers and bindings: the crate is native Rust; the oracle crate builds its C++
# with the cmake program itself, without any of these
deny = [
    { crate = "cc", reason = "no C or C++ in the twin" },
    { crate = "cmake", reason = "no C or C++ in the twin" },
    { crate = "bindgen", reason = "no FFI in the twin" },
    { crate = "cxx", reason = "no FFI in the twin" },
    { crate = "cxx-build", reason = "no FFI in the twin" },
    { crate = "pkg-config", reason = "no C or C++ in the twin" },
    { crate = "vcpkg", reason = "no C or C++ in the twin" },
    { crate = "libc", reason = "no FFI in the twin" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
