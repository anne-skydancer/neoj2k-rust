#
# ClusterFuzzLite corpus pruning, daily after batch fuzzing (cflite-batch.yml): each target's stored
# corpus is merged down to the inputs that add coverage, so the batch and pull request runs load
# only what still counts.
name: ClusterFuzzLite corpus pruning

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  prune:
    name: prune
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: cflite-prune
      cancel-in-progress: false
    steps:
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          language: rust
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: prune
          output-sarif: false
