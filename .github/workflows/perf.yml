#
# Performance in CI (doc/bench.md, "Measuring in CI"). Timing moves here from the owner's machine. A shared runner is
# noisy and its CPU differs from job to job, so every comparison happens inside ONE job, on one machine, and numbers are
# never compared across jobs:
#   plan          the matrices and the settings, from the trigger and the inputs (tools/perf_summary.py)
#   gate-pairs    per OS, CPU level and pair: the Tier-1 benchmark (tools/bench_tier1.py) builds the pair's base and
#                 head and a byte copy of the base (the control), runs the three interleaved, and prints the gate
#   rust-vs-cpp   per OS and CPU level: the whole-codec suites that time Rust and the C++ oracle in one process,
#                 three repetitions, one table (tools/perf_summary.py)
# By hand: gh workflow run perf.yml --ref main -f rounds=24
# Any one pair: gh workflow run perf.yml --ref BRANCH -f pair_base=SHA -f pair_head=SHA -f pair_side=decode
#   [-f pair_name=NAME] [-f vs_cpp=true]  (only that pair, and the Rust-versus-C++ jobs only with vs_cpp)
# A pull request that touches this workflow or its two tools runs it once in quick mode (3 rounds, one pair, one
# repetition), as a smoke test: those numbers prove the workflow works and nothing about speed.
name: Performance

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Rounds of the three builds in each gate-pairs job (after one warm-up round)
        type: string
        default: "24"
      quick:
        description: Quick mode (3 rounds, one pair, one repetition); a smoke test, not a measurement
        type: boolean
        default: false
      pair_base:
        description: "One pair of your own, the base (a ref or commit; with pair_head): only that pair runs"
        type: string
        default: ""
      pair_head:
        description: One pair of your own, the head (a ref or commit; with pair_base)
        type: string
        default: ""
      pair_side:
        description: The side the pair changes (decode or encode); only names the pair
        type: string
        default: decode
      pair_name:
        description: The pair's name (default adhoc-decode or adhoc-encode)
        type: string
        default: ""
      vs_cpp:
        description: With a pair of your own, also run the Rust-versus-C++ jobs (they are off otherwise)
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/perf.yml
      - tools/bench_tier1.py
      - tools/perf_summary.py

permissions:
  contents: read

# one performance run per ref at a time: a dispatch waits for the one before it, only a pull request's run is replaced
concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      quick: ${{ steps.plan.outputs.quick }}
      rounds: ${{ steps.plan.outputs.rounds }}
      reps: ${{ steps.plan.outputs.reps }}
      bench_args: ${{ steps.plan.outputs.bench_args }}
      gate: ${{ steps.plan.outputs.gate }}
      cells: ${{ steps.plan.outputs.cells }}
      cells_count: ${{ steps.plan.outputs.cells_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test of the helpers
        run: python3 -I tools/perf_summary.py selftest
      - name: Matrices and settings
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          QUICK_IN: ${{ inputs.quick }}
          ROUNDS_IN: ${{ inputs.rounds }}
          PAIR_BASE_IN: ${{ inputs.pair_base }}
          PAIR_HEAD_IN: ${{ inputs.pair_head }}
          PAIR_SIDE_IN: ${{ inputs.pair_side }}
          PAIR_NAME_IN: ${{ inputs.pair_name }}
          VS_CPP_IN: ${{ inputs.vs_cpp }}
        run: python3 -I tools/perf_summary.py plan
  gate-pairs:
    name: PAIR ${{ matrix.name }} (${{ matrix.os }}, ${{ matrix.cpu }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.gate) }}
    env:
      NJ2K_CPP_SOURCE: ${{ github.workspace }}/cpp
      PAIR_NAME: ${{ matrix.name }}
      PAIR_BASE: ${{ matrix.base }}
      PAIR_HEAD: ${{ matrix.head }}
      CPU_LEVEL: ${{ matrix.cpu }}
      RUNNER_OS_LABEL: ${{ matrix.os }}
      ROUNDS: ${{ needs.plan.outputs.rounds }}
      BENCH_ARGS: ${{ needs.plan.outputs.bench_args }}
      QUICK: ${{ needs.plan.outputs.quick }}
      PY: ${{ matrix.py }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anne-skydancer/neo-j2k
          ref: 00f273d502d211905adb756d2f75ef74321983d0 # neo-j2k v0.1.3 (the commit, not the tag object)
          persist-credentials: false
          path: cpp
      - name: Toolchain
        run: rustup show
      - name: Runner CPU
        run: |
          set -euo pipefail
          mkdir -p perf
          "$PY" -I tools/perf_summary.py machine | tr -d '\r' | tee perf/machine.txt
      - name: The pair's refs
        run: |
          set -euo pipefail
          resolve() {
            git rev-parse --verify --quiet "$1^{commit}" || {
              echo "::error::the ref '$1' of pair $PAIR_NAME does not exist in this checkout (fetch-depth 0)" >&2
              exit 1
            }
          }
          base_sha="$(resolve "$PAIR_BASE")"
          head_sha="$(resolve "$PAIR_HEAD")"
          echo "BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$head_sha" >> "$GITHUB_ENV"
          git log -1 --format='base %H %s' "$base_sha"
          git log -1 --format='head %H %s' "$head_sha"
      - name: Tier-1 benchmark, base against head, with the control
        run: |
          set -euo pipefail
          mkdir -p perf
          # shellcheck disable=SC2086
          "$PY" -I tools/bench_tier1.py --base-ref "$BASE_SHA" --head-ref "$HEAD_SHA" --rounds "$ROUNDS" \
            --cpu "$CPU_LEVEL" --cpp-source "$NJ2K_CPP_SOURCE" --allow-unpinned $BENCH_ARGS | tee perf/bench.txt
      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          test -f perf/bench.txt || { echo "no benchmark output" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          {
            echo "### PAIR $PAIR_NAME, $RUNNER_OS_LABEL, $CPU_LEVEL, $(sed 's/, [0-9]* logical CPUs$//' perf/machine.txt 2>/dev/null), $(sed 's/^.*, \([0-9]*\) logical CPUs$/\1/' perf/machine.txt 2>/dev/null) nproc"
            echo
            echo "Base ${BASE_SHA:-unresolved}, head ${HEAD_SHA:-unresolved} (the pair's refs: $PAIR_BASE, $PAIR_HEAD)."
            echo
            echo "Hosted runner: the pin to one CPU is allowed to fail (--allow-unpinned); the line below says whether it held, and the control row (a byte copy of the base) bounds the noise. The numbers are valid inside this job only."
            if [ "$QUICK" = true ]; then
              echo
              echo "Quick mode (smoke test): a few rounds and short units, the figures prove nothing about speed."
            fi
            echo
            tr -d '\r' < perf/bench.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the raw output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-pair-${{ matrix.name }}-${{ matrix.os }}-${{ matrix.cpu }}
          path: perf/
          if-no-files-found: ignore
  rust-vs-cpp:
    name: Rust versus C++ (${{ matrix.os }}, ${{ matrix.cpu }})
    needs: plan
    if: needs.plan.outputs.cells_count != '0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.cells) }}
    env:
      NJ2K_ORACLE_NO_BUILD: "0"
      NJ2K_CPP_SOURCE: ${{ github.workspace }}/cpp
      RUSTFLAGS: ${{ matrix.rustflags }}
      OS_LABEL: ${{ matrix.os }}
      CPU_LEVEL: ${{ matrix.cpu }}
      COMPILER: ${{ matrix.compiler }}
      ORACLE_SIMD: ${{ matrix.oracle }}
      REPS: ${{ needs.plan.outputs.reps }}
      QUICK: ${{ needs.plan.outputs.quick }}
      PY: ${{ matrix.py }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anne-skydancer/neo-j2k
          ref: 00f273d502d211905adb756d2f75ef74321983d0 # neo-j2k v0.1.3 (the commit, not the tag object)
          persist-credentials: false
          path: cpp
      - name: C++ toolchain (Linux, GCC 15)
        if: runner.os == 'Linux'
        env:
          ORACLE_PRESET: ${{ matrix.preset }}
        run: |
          set -euo pipefail
          {
            echo "NJ2K_ORACLE_PRESET=$ORACLE_PRESET"
            echo "CC=gcc-15"
            echo "CXX=g++-15"
          } >> "$GITHUB_ENV"
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq ninja-build g++-15
          g++-15 --version | head -n 1
      - name: Runner CPU
        run: |
          set -euo pipefail
          mkdir -p perf
          "$PY" -I tools/perf_summary.py machine | tr -d '\r' | tee perf/machine.txt
      - name: Toolchain
        run: rustup show
      - name: Build cache
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          shared-key: perf-${{ matrix.os }}-${{ matrix.cpu }}
          cache-on-failure: true
      - name: Build the suites (the Rust codec and the C++ oracle)
        run: |
          set -euo pipefail
          cargo test --release --locked -p neo-j2k --test small_image_gates --no-run
      - name: The three suites, repeated
        run: |
          set -euo pipefail
          mkdir -p perf
          for rep in $(seq 1 "$REPS"); do
            echo "repetition $rep of $REPS"
            cargo test --release --locked -p neo-j2k --test small_image_gates -- --ignored --nocapture --test-threads=1 \
              --exact large_image_executor_latency small_image_median_latency small_encoder_median_latency \
              > "perf/rep-$rep.txt"
          done
      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          ls perf/rep-*.txt > /dev/null 2>&1 || { echo "no suite output" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          {
            echo "### Native Rust versus neo-j2k C++ 0.1.3, $OS_LABEL, $CPU_LEVEL, $(sed 's/, [0-9]* logical CPUs$//' perf/machine.txt 2>/dev/null), $(sed 's/^.*, \([0-9]*\) logical CPUs$/\1/' perf/machine.txt 2>/dev/null) nproc"
            echo
            if [ "$QUICK" = true ]; then
              echo "Quick mode (smoke test): one repetition, the figures prove nothing about speed."
              echo
            fi
            "$PY" -I tools/perf_summary.py table --dir perf --compiler "$COMPILER" --oracle "$ORACLE_SIMD" | tr -d '\r'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the raw output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-rust-vs-cpp-${{ matrix.os }}-${{ matrix.cpu }}
          path: perf/
          if-no-files-found: ignore
