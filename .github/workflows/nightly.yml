# Copyright (c) 2026, Anne Skydancer (neo-j2k)
#
# Nightly, on Linux: ten minutes of libFuzzer (cargo-fuzz, the nightly pinned in nightly-toolchain)
# per fuzz target with AddressSanitizer, one job each. The two targets that need no C++ run on the
# stock runner; the four that compare with the C++ oracle (differential, encode_options,
# api_sequence, t1) check out the C++ repository and build the oracle with GCC 16, as oracle.yml does.
# The tier1-sweeps job runs the long Tier-1 comparisons with the C++ (every single decision of the MQ
# decoder and encoder, 443 million and 4.4 billion, and the long generated code-block draws), which
# the normal test run trims to seconds.
# The fuzzers start from the corpus the earlier nights grew, kept in the Actions cache (minimised to
# the inputs that add coverage), and from the checked-in seeds; findings are uploaded as an artifact.
# ClusterFuzzLite (cflite-*.yml) fuzzes the first two targets on pull requests and in batch too.
name: Nightly fuzzing

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzzing time per target, in seconds
        default: '600'

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  NJ2K_ORACLE_PRESET: linux-gcc

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: header_decode
            seeds: corpus/generated fuzz/seeds/jp2
            max_len: 1048576
            timeout: 5
          - target: roundtrip
            seeds: fuzz/seeds/roundtrip
            max_len: 16400
            timeout: 5
          - target: differential
            oracle: true
            seeds: corpus/generated fuzz/seeds/jp2
            max_len: 131072
            timeout: 5
          - target: encode_options
            oracle: true
            seeds: fuzz/seeds/encode
            max_len: 16400
            timeout: 5
          - target: api_sequence
            oracle: true
            seeds: fuzz/seeds/api_sequence
            max_len: 18
            timeout: 10
          - target: t1
            oracle: true
            seeds: fuzz/seeds/t1
            max_len: 8192
            timeout: 5
    env:
      FEATURES: ${{ matrix.oracle && '--features oracle' || '' }}
      # the prebuilt cargo-fuzz is a musl binary, whose default target would be musl, where
      # AddressSanitizer does not work
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: C++ oracle sources
        if: matrix.oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anne-skydancer/neo-j2k
          ref: 649201f8c5a6ddb0683b165a5616c56fdf18d3c3 # upstream-compatible partial decoding
          persist-credentials: false
          path: cpp
      - name: C++ toolchain
        if: matrix.oracle
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq ninja-build g++-16
          {
            echo "NJ2K_CPP_SOURCE=$GITHUB_WORKSPACE/cpp"
            echo "CC=gcc-16"
            echo "CXX=g++-16"
          } >> "$GITHUB_ENV"
      - name: Toolchain
        run: |
          set -euo pipefail
          nightly="$(cat nightly-toolchain)"
          rustup toolchain install "$nightly" --profile minimal
          echo "NIGHTLY=$nightly" >> "$GITHUB_ENV"
      - name: cargo-fuzz
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-fuzz@0.13.2
      - name: Build cache
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: fuzz
          cache-on-failure: true
          shared-key: fuzz-${{ matrix.oracle && 'oracle' || 'plain' }}
      - name: Corpus of the earlier nights (cache)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: nightly-rust-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: nightly-rust-corpus-${{ matrix.target }}-
      - name: Seeds and regression inputs replay
        run: |
          set -euo pipefail
          mkdir -p "fuzz/corpus/${{ matrix.target }}"
          # every kept input and seed once, before the new fuzzing: a regression fails here, fast
          # shellcheck disable=SC2086
          cargo +"$NIGHTLY" fuzz run --fuzz-dir fuzz --target "$TARGET" $FEATURES "${{ matrix.target }}" \
            "fuzz/corpus/${{ matrix.target }}" ${{ matrix.seeds }} fuzz/regressions \
            -- -runs=0 -max_len=${{ matrix.max_len }} -timeout=${{ matrix.timeout }}
      - name: Fuzz
        env:
          # the JPEG 2000 dictionary is of markers and boxes: the Tier-1 target's input is a block's fields and bytes
          DICT: ${{ matrix.target == 't1' && '' || '-dict=fuzz/j2k.dict' }}
        run: |
          set -euo pipefail
          # new inputs go to the first folder: the corpus the cache keeps
          # shellcheck disable=SC2086
          cargo +"$NIGHTLY" fuzz run --fuzz-dir fuzz --target "$TARGET" $FEATURES "${{ matrix.target }}" \
            "fuzz/corpus/${{ matrix.target }}" ${{ matrix.seeds }} \
            -- -max_len=${{ matrix.max_len }} -max_total_time=${{ inputs.seconds || '600' }} \
            -timeout=${{ matrix.timeout }} $DICT -print_final_stats=1
      - name: Minimise the corpus
        if: always()
        run: |
          set -uo pipefail
          # keep only the inputs that add coverage, so the cache stays small
          # shellcheck disable=SC2086
          cargo +"$NIGHTLY" fuzz cmin --fuzz-dir fuzz --target "$TARGET" $FEATURES "${{ matrix.target }}" \
            || echo "cmin failed, the corpus is kept as it is"
          echo "${{ matrix.target }}: $(find "fuzz/corpus/${{ matrix.target }}" -type f | wc -l) inputs kept"
      - name: Keep the corpus (cache)
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: nightly-rust-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
  reference:
    name: extended reference cuts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NJ2K_ORACLE_NO_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show
      - name: Build cache
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          shared-key: reference
          cache-on-failure: true
      - name: Replay the extended cut table
        run: cargo test --release --locked -p neo-j2k --test reference_replay -- --ignored --exact nightly_reference_cuts
  tier1-sweeps:
    name: Tier-1 sweeps against the C++ (${{ matrix.cpu }})
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cpu: [baseline, x86-64-v3]
        include:
          - cpu: baseline
            rustflags: ""
          - cpu: x86-64-v3
            rustflags: -C target-cpu=x86-64-v3
    env:
      NJ2K_ORACLE_NO_BUILD: "0"
      NJ2K_CPP_SOURCE: ${{ github.workspace }}/cpp
      RUSTFLAGS: ${{ matrix.rustflags }}
      CC: gcc-16
      CXX: g++-16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anne-skydancer/neo-j2k
          ref: 649201f8c5a6ddb0683b165a5616c56fdf18d3c3 # upstream-compatible partial decoding
          persist-credentials: false
          path: cpp
      - name: C++ toolchain
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq ninja-build g++-16
      - name: Toolchain
        run: rustup show
      - name: Build cache
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          shared-key: tier1-sweeps-${{ matrix.cpu }}
          cache-on-failure: true
      - name: Every single decision of the MQ decoder and encoder, the flush, and the long code-block draws
        run: |
          set -euo pipefail
          cargo test --release --locked -p neo-j2k --lib -- --ignored nightly_ | tee sweeps.log
          # the sweeps are the six tests named nightly_: a rename that makes the filter match fewer must not pass
          passed="$(sed -n 's/^test result: ok\. \([0-9]*\) passed.*/\1/p' sweeps.log)"
          test "${passed:-0}" -ge 6 || { echo "::error::only ${passed:-0} nightly_ tests ran, six expected"; exit 1; }
  fuzz-windows:
    name: ${{ matrix.cpu }} on Windows (AddressSanitizer, MSVC)
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cpu: [x86-64, x86-64-v3]
    env:
      NJ2K_ORACLE_DIR: ${{ github.workspace }}/cpp/build/windows-msvc-asan
      FUZZ_SECONDS: ${{ inputs.seconds || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anne-skydancer/neo-j2k
          ref: 649201f8c5a6ddb0683b165a5616c56fdf18d3c3 # upstream-compatible partial decoding
          persist-credentials: false
          path: cpp
      - name: Nightly
        shell: pwsh
        run: |
          $nightly = (Get-Content nightly-toolchain -Raw).Trim()
          rustup toolchain install $nightly --profile minimal
      - name: cargo-fuzz
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-fuzz@0.13.2
      - name: Build cache
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: fuzz
          shared-key: fuzz-windows-${{ matrix.cpu }}
          cache-on-failure: true
      - name: Build the sanitized C++ oracle
        shell: bash
        working-directory: cpp
        run: |
          set -euo pipefail
          cmake --preset windows-msvc-asan "-DNJ2K_RUST_SHIM_SOURCE=$(cygpath -m "$GITHUB_WORKSPACE")/neo-j2k-oracle/shim" \
            -DNJ2K_BUILD_RUST_SHIM=ON -DNJ2K_BUILD_TESTS=OFF -DNJ2K_BUILD_TOOLS=OFF -DNJ2K_BUILD_BENCH=OFF \
            -DNJ2K_BUILD_SHARED=OFF -DNJ2K_INSTALL=OFF
          cmake --build --preset windows-msvc-asan --target nj2k_rust_shim --parallel
      - name: Fuzz the six targets
        shell: pwsh
        env:
          RUSTFLAGS: -C target-cpu=${{ matrix.cpu }}
        run: |
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer'
          $vs = & (Join-Path $installer vswhere.exe) -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $nightly = (Get-Content nightly-toolchain -Raw).Trim()
          $targets = @(
            @('header_decode', '', 'corpus/generated fuzz/seeds/jp2', 1048576, 10),
            @('roundtrip', '', 'fuzz/seeds/roundtrip', 16400, 10),
            @('differential', '--features oracle', 'corpus/generated fuzz/seeds/jp2', 131072, 10),
            @('encode_options', '--features oracle', 'fuzz/seeds/encode', 16400, 10),
            @('api_sequence', '--features oracle', 'fuzz/seeds/api_sequence', 18, 10),
            @('t1', '--features oracle', 'fuzz/seeds/t1', 8192, 10)
          )
          foreach ($t in $targets) {
            $name, $features, $seeds, $maxLen, $timeout = $t
            New-Item -ItemType Directory -Force "fuzz/corpus/$name" | Out-Null
            $features = if ($features) { $features -split ' ' } else { @() }
            cargo "+$nightly" fuzz run --fuzz-dir fuzz @features $name "fuzz/corpus/$name" ($seeds -split ' ') fuzz/regressions -- "-max_len=$maxLen" "-max_total_time=$env:FUZZ_SECONDS" "-timeout=$timeout" -print_final_stats=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check the fuzz lockfile
        shell: bash
        run: git diff --exit-code -- fuzz/Cargo.lock
      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-windows-${{ matrix.cpu }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
