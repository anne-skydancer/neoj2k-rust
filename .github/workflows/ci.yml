name: Rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  NJ2K_ORACLE_NO_BUILD: "1"

jobs:
  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p neo-j2k --lib --all-features --locked -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p neo-j2k --all-features --no-deps --locked
      - name: Native Rust policy
        run: python -I tools/check_rust_native.py
      - name: Package
        run: cargo package -p neo-j2k --locked
      - name: Fuzz harness compile check
        run: cargo test --manifest-path fuzz/Cargo.toml --locked --lib
  native-tests:
    name: Native tests (${{ matrix.os }}, ${{ matrix.cpu }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        cpu: [baseline, x86-64-v3]
        include:
          - cpu: baseline
            rustflags: ""
          - cpu: x86-64-v3
            rustflags: -C target-cpu=x86-64-v3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show
      - name: Pure-Rust test kit
        run: cargo test --release -p neo-j2k-testkit --locked
      - name: Native reference replay
        run: cargo test --release -p neo-j2k --test reference_replay --locked -- --test-threads=1
      - name: Fuzz harness compile check
        run: cargo test --manifest-path fuzz/Cargo.toml --locked --lib
