name: Rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  NJ2K_ORACLE_NO_BUILD: "1"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Workflows and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 5 --retry-delay 10 -o "$archive"             "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.20.2
      - name: Licences, advisories, sources and bans
        run: cargo deny --locked check
  miri:
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NJ2K_ORACLE_NO_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          set -euo pipefail
          nightly="$(cat nightly-toolchain)"
          rustup toolchain install "$nightly" --profile minimal --component miri,rust-src
          echo "NIGHTLY=$nightly" >> "$GITHUB_ENV"
      - name: Build cache
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          shared-key: miri
          cache-on-failure: true
      - name: Miri setup
        run: cargo +"$NIGHTLY" miri setup
      - name: Unit tests
        run: cargo +"$NIGHTLY" miri test -p neo-j2k-testkit -p neo-j2k --lib --locked
      - name: Decoder requests
        run: cargo +"$NIGHTLY" miri test -p neo-j2k --test miri_decode --locked
      - name: AVX2 kernels
        env:
          RUSTFLAGS: -C target-feature=+avx2
          CARGO_TARGET_DIR: target-miri-avx2
        run: cargo +"$NIGHTLY" miri test -p neo-j2k --lib --locked -- avx2_ interleaved_targets_match_plane_writes_at_every_channel_count
  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show
      - name: Build cache
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          shared-key: quality
          workspaces: |
            .
            fuzz
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (baseline x86-64)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Clippy (x86-64-v3)
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
          CARGO_TARGET_DIR: target-v3
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Clippy (decoder-only)
        run: cargo clippy -p neo-j2k --all-targets --no-default-features --features std --locked -- -D warnings
      - name: Clippy (fuzz crate)
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --document-private-items --locked
      - name: Native Rust policy
        run: python -I tools/check_rust_native.py
      - name: Benchmark driver self-test
        run: python -I tools/bench_tier1.py --selftest
      - name: Performance summary self-test
        run: python -I tools/perf_summary.py selftest
      - name: Package
        run: cargo package -p neo-j2k --locked
      - name: Fuzz harness, seeds and regression inputs
        run: cargo test --release --manifest-path fuzz/Cargo.toml --locked --lib
  native-tests:
    name: Native tests (${{ matrix.os }}, ${{ matrix.cpu }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        cpu: [baseline, x86-64-v3]
        include:
          - cpu: baseline
            rustflags: ""
          - cpu: x86-64-v3
            rustflags: -C target-cpu=x86-64-v3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show
      - name: Build cache
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          shared-key: native-${{ matrix.os }}-${{ matrix.cpu }}
          workspaces: |
            .
            fuzz
      - name: Pure-Rust test kit
        run: cargo test --release -p neo-j2k-testkit --locked
      - name: Benchmark crate
        run: cargo test --release -p neo-j2k-bench --locked
      - name: Native reference replay
        run: cargo test --release -p neo-j2k --test reference_replay --locked -- --test-threads=1
      - name: Fuzz harness, seeds and regression inputs
        run: cargo test --release --manifest-path fuzz/Cargo.toml --locked --lib

  # The jobs below test against the C++ oracle: the C++ neo-j2k repository is checked out beside the
  # crate (cpp/) and the oracle crate's build.rs builds it with CMake (NJ2K_CPP_SOURCE). Each job
  # runs every test at the baseline x86-64 and at x86-64-v3, and the fuzz crate's seed and
  # regression replay against the oracle.
  oracle-windows:
    name: Oracle tests (Windows, MSVC)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      NJ2K_ORACLE_NO_BUILD: "0"
      NJ2K_CPP_SOURCE: ${{ github.workspace }}/cpp
      NJ2K_TESTDATA: ${{ github.workspace }}/.testdata/openjpeg-data
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anne-skydancer/neo-j2k
          ref: 00f273d502d211905adb756d2f75ef74321983d0 # neo-j2k v0.1.3 (the commit, not the tag object)
          persist-credentials: false
          path: cpp
      - name: Conformance data (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .testdata/openjpeg-data
          key: openjpeg-data-conformance-${{ hashFiles('tools/fetch_testdata.py') }}-windows
      - name: Conformance data (fetch)
        run: python -I tools/fetch_testdata.py
      - name: Toolchain
        run: rustup show
      - name: Build cache
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          shared-key: oracle-windows
          workspaces: |
            .
            fuzz
      - name: Test (baseline x86-64)
        run: |
          set -euo pipefail
          export NJ2K_TEST_TMP="$RUNNER_TEMP" TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP"
          cargo test --release --workspace --locked
          cargo test --release --manifest-path fuzz/Cargo.toml --features oracle --locked --lib
      - name: Test (x86-64-v3)
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
          CARGO_TARGET_DIR: target-v3
        run: |
          set -euo pipefail
          export NJ2K_TEST_TMP="$RUNNER_TEMP" TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP"
          cargo test --release --workspace --locked
          cargo test --release --manifest-path fuzz/Cargo.toml --features oracle --locked --lib
      - name: Benchmark smoke (the timing path and the pin)
        run: |
          set -euo pipefail
          cargo build --release --locked -p neo-j2k-bench
          target/release/neo-j2k-bench.exe --pin 0 --min-mcycles 1 --units 1 --blocks 16 --dumps "$NJ2K_CPP_SOURCE/tests/vectors/t1_bench"
  oracle-linux:
    name: Oracle tests (Linux, GCC 15)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      NJ2K_ORACLE_NO_BUILD: "0"
      NJ2K_ORACLE_PRESET: linux-gcc
      NJ2K_CPP_SOURCE: ${{ github.workspace }}/cpp
      NJ2K_TESTDATA: ${{ github.workspace }}/.testdata/openjpeg-data
      CC: gcc-15
      CXX: g++-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anne-skydancer/neo-j2k
          ref: 00f273d502d211905adb756d2f75ef74321983d0 # neo-j2k v0.1.3
          persist-credentials: false
          path: cpp
      - name: C++ toolchain
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq ninja-build g++-15
          "$CXX" --version | head -n 1
      - name: Conformance and non-regression data (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .testdata/openjpeg-data
          key: openjpeg-data-full-${{ hashFiles('tools/fetch_testdata.py') }}-linux
      - name: Conformance and non-regression data (fetch)
        run: python3 -I tools/fetch_testdata.py --all
      - name: Toolchain
        run: rustup show
      - name: Build cache
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          shared-key: oracle-linux
          workspaces: |
            .
            fuzz
      - name: Test (baseline x86-64)
        run: |
          export NJ2K_TEST_TMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP"
          cargo test --release --workspace --locked
          cargo test --release --manifest-path fuzz/Cargo.toml --features oracle --locked --lib
      - name: Test (x86-64-v3)
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
          CARGO_TARGET_DIR: target-v3
        run: |
          export NJ2K_TEST_TMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP"
          cargo test --release --workspace --locked
          cargo test --release --manifest-path fuzz/Cargo.toml --features oracle --locked --lib
      - name: Benchmark smoke (the six decoder dumps and the encoder sets, outputs and then the timing path)
        run: |
          set -euo pipefail
          cargo build --release --locked -p neo-j2k-bench
          target/release/neo-j2k-bench --digest-only --blocks 16 --dumps "$NJ2K_CPP_SOURCE/tests/vectors/t1_bench"
          target/release/neo-j2k-bench --pin 0 --min-mcycles 1 --units 1 --blocks 16 --dumps "$NJ2K_CPP_SOURCE/tests/vectors/t1_bench"
      - name: The cheapest Tier-1 sweep (every single decision of the MQ decoder, 443 million)
        run: cargo test --release --locked -p neo-j2k --lib -- --ignored --exact t1::mq::differential::nightly_mq_decoder_every_decision
  oracle-linux-lts:
    name: Oracle tests (Ubuntu 24.04, GCC 14)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    container:
      image: ubuntu:24.04
      options: --dns 168.63.129.16 --dns 8.8.8.8 --dns 1.1.1.1
    env:
      NJ2K_ORACLE_NO_BUILD: "0"
      NJ2K_ORACLE_PRESET: linux-gcc
      NJ2K_CPP_SOURCE: ${{ github.workspace }}/cpp
      CC: gcc-14
      CXX: g++-14
      # link with the GCC the oracle is built with: its driver finds its own libstdc++ (the
      # container's cc is another GCC, whose search path does not hold GCC 14's)
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: gcc-14
      # the container runs as root, whose home is /root, while the runner sets HOME to
      # /github/home: rustup reports that mismatch, so HOME is root's and rustup has its own homes
      HOME: /root
      RUSTUP_HOME: /opt/rustup
      CARGO_HOME: /opt/cargo
    steps:
      - name: Toolchain
        run: |
          set -eu
          # the runners' in-Azure mirror, bounded fetches, one retry
          sed -i 's#http://archive.ubuntu.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g; s#http://security.ubuntu.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list.d/ubuntu.sources
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          for attempt in 1 2; do
            if apt-get $apt_opts update -qq && DEBIAN_FRONTEND=noninteractive apt-get $apt_opts install -y -qq g++-14 cmake ninja-build python3 git ca-certificates curl; then
              break
            fi
            if [ "$attempt" = 2 ]; then echo "::error::apt failed twice"; exit 1; fi
            echo "apt failed (attempt $attempt of 2); retrying in 30 s"; sleep 30
          done
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          gcc-14 --version | head -n 1
          cmake --version | head -n 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anne-skydancer/neo-j2k
          ref: 00f273d502d211905adb756d2f75ef74321983d0 # neo-j2k v0.1.3
          persist-credentials: false
          path: cpp
      - name: Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install || rustup show
          rustc --version
      - name: Test (baseline x86-64)
        run: |
          export NJ2K_TEST_TMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP"
          cargo test --release --workspace --locked
      - name: Test (x86-64-v3)
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
          CARGO_TARGET_DIR: target-v3
        run: |
          export NJ2K_TEST_TMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP"
          cargo test --release --workspace --locked
