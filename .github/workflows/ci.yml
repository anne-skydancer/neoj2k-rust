name: Rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  NJ2K_ORACLE_NO_BUILD: "1"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Workflows and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 5 --retry-delay 10 -o "$archive"             "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.20.2
      - name: Licences, advisories, sources and bans
        run: cargo deny --locked check
  miri:
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NJ2K_ORACLE_NO_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          set -euo pipefail
          nightly="$(cat nightly-toolchain)"
          rustup toolchain install "$nightly" --profile minimal --component miri,rust-src
          echo "NIGHTLY=$nightly" >> "$GITHUB_ENV"
      - name: Build cache
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          shared-key: miri
          cache-on-failure: true
      - name: Miri setup
        run: cargo +"$NIGHTLY" miri setup
      - name: Unit tests
        run: cargo +"$NIGHTLY" miri test -p neo-j2k-testkit -p neo-j2k --lib --locked
      - name: Decoder requests
        run: cargo +"$NIGHTLY" miri test -p neo-j2k --test miri_decode --locked
      - name: AVX2 kernels
        env:
          RUSTFLAGS: -C target-feature=+avx2
          CARGO_TARGET_DIR: target-miri-avx2
        run: cargo +"$NIGHTLY" miri test -p neo-j2k --lib --locked -- avx2_ interleaved_targets_match_plane_writes_at_every_channel_count
  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show
      - name: Build cache
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          shared-key: quality
          workspaces: |
            .
            fuzz
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (baseline x86-64)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Clippy (x86-64-v3)
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
          CARGO_TARGET_DIR: target-v3
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Clippy (decoder-only)
        run: cargo clippy -p neo-j2k --all-targets --no-default-features --features std --locked -- -D warnings
      - name: Clippy (fuzz crate)
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --document-private-items --locked
      - name: Native Rust policy
        run: python -I tools/check_rust_native.py
      - name: Package
        run: cargo package -p neo-j2k --locked
      - name: Fuzz harness, seeds and regression inputs
        run: cargo test --release --manifest-path fuzz/Cargo.toml --locked --lib
  native-tests:
    name: Native tests (${{ matrix.os }}, ${{ matrix.cpu }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        cpu: [baseline, x86-64-v3]
        include:
          - cpu: baseline
            rustflags: ""
          - cpu: x86-64-v3
            rustflags: -C target-cpu=x86-64-v3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show
      - name: Build cache
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          shared-key: native-${{ matrix.os }}-${{ matrix.cpu }}
          workspaces: |
            .
            fuzz
      - name: Pure-Rust test kit
        run: cargo test --release -p neo-j2k-testkit --locked
      - name: Native reference replay
        run: cargo test --release -p neo-j2k --test reference_replay --locked -- --test-threads=1
      - name: Fuzz harness, seeds and regression inputs
        run: cargo test --release --manifest-path fuzz/Cargo.toml --locked --lib
